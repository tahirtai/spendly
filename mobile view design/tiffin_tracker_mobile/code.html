<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Tiffin &amp; Mess Tracker - Mobile iOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
<style data-purpose="glassmorphism">
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
  </style>
<style data-purpose="segmented-control">
    .segment-button input:checked + div {
      background-color: #4F46E5; /* Indigo 600 */
      color: white;
      border-color: #4F46E5;
    }
    .segment-button input:checked + div .text-gray-500 {
      color: #E0E7FF; /* Indigo 100 for subtitle when selected */
    }
  </style>
<style data-purpose="hide-scrollbar">
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-gray-800 antialiased pb-24">
<!-- BEGIN: Mobile Header -->
<header class="bg-white px-4 py-4 sticky top-0 z-10 shadow-sm">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-lg bg-indigo-100 flex items-center justify-center text-indigo-600">
<i class="fa-solid fa-utensils"></i>
</div>
<h1 class="text-xl font-bold text-gray-900">Tiffin Tracker</h1>
</div>
<div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 overflow-hidden">
<i class="fa-solid fa-user"></i>
</div>
</div>
<p class="text-xs text-gray-500">Log meals and track mess dues.</p>
</header>
<!-- END: Mobile Header -->
<!-- BEGIN: Main Content Area -->
<main class="p-4 space-y-6">
<!-- BEGIN: Workspace Rates Info -->
<section class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 flex items-center justify-between" data-purpose="rates-info">
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-green-500"></div>
<span class="text-xs font-medium text-gray-700">Active Rates:</span>
</div>
<div class="text-xs text-gray-600 space-x-3">
<span class="">Half: <strong class="text-indigo-700">₹50</strong></span>
<span class="">Full: <strong class="text-indigo-700">₹80</strong></span>
</div>
</section>
<!-- END: Workspace Rates Info -->
<!-- BEGIN: Horizontal Date Selector -->
<section data-purpose="date-selector">
<div class="flex items-center justify-between mb-3">
<h2 class="text-sm font-semibold text-gray-800">August 2026</h2>
<button class="text-indigo-600 text-xs font-medium flex items-center"><i class="fa-regular fa-calendar mr-1"></i> Calendar</button>
</div>
<div class="flex overflow-x-auto hide-scrollbar space-x-3 pb-2 -mx-4 px-4 snap-x">
<!-- Date Item (Past/Missing) -->
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border border-orange-200 bg-orange-50 flex flex-col items-center justify-center cursor-pointer">
<span class="text-xs text-orange-600 font-medium">Mon</span>
<span class="text-xl font-bold text-gray-900 my-1">3</span>
<div class="w-1.5 h-1.5 rounded-full bg-orange-400"></div>
</div>
<!-- Date Item (Past/Logged) -->
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border border-green-200 bg-green-50 flex flex-col items-center justify-center cursor-pointer">
<span class="text-xs text-green-700 font-medium">Tue</span>
<span class="text-xl font-bold text-gray-900 my-1">4</span>
<div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
</div>
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border border-green-200 bg-green-50 flex flex-col items-center justify-center cursor-pointer">
<span class="text-xs text-green-700 font-medium">Wed</span>
<span class="text-xl font-bold text-gray-900 my-1">5</span>
<div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
</div>
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border border-green-200 bg-green-50 flex flex-col items-center justify-center cursor-pointer">
<span class="text-xs text-green-700 font-medium">Thu</span>
<span class="text-xl font-bold text-gray-900 my-1">6</span>
<div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
</div>
<!-- Date Item (Active/Selected) -->
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border-2 border-[#5e5ce6] bg-white shadow-md flex flex-col items-center justify-center cursor-pointer relative"><span class="text-xs text-[#5e5ce6] font-semibold">Fri</span><span class="text-xl font-bold text-[#5e5ce6] my-1">7</span><div class="w-1.5 h-1.5 rounded-full bg-green-500"></div></div>
<!-- Date Item (Future) -->
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border border-gray-200 bg-white flex flex-col items-center justify-center cursor-pointer text-gray-400">
<span class="text-xs font-medium">Sat</span>
<span class="text-xl font-bold my-1">8</span>
<div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
</div>
<div class="snap-center shrink-0 w-16 h-20 rounded-2xl border border-gray-200 bg-white flex flex-col items-center justify-center cursor-pointer text-gray-400">
<span class="text-xs font-medium">Sun</span>
<span class="text-xl font-bold my-1">9</span>
<div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
</div>
</div>
<div class="flex justify-center items-center space-x-4 mt-2 text-[10px] text-gray-500">
<span class="flex items-center"><div class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1"></div> Logged</span>
<span class="flex items-center"><div class="w-1.5 h-1.5 rounded-full bg-orange-400 mr-1"></div> Missing</span>
</div>
</section>
<!-- END: Horizontal Date Selector -->
<!-- BEGIN: Meal Selections -->
<section class="space-y-4" data-purpose="meal-cards">
<!-- Lunch Card -->
<article class="glass-card rounded-2xl p-4">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center space-x-2 text-orange-500">
<i class="fa-regular fa-sun text-lg"></i>
<h3 class="font-semibold text-gray-900">Lunch</h3>
</div>
<span class="text-sm font-medium text-indigo-600">₹50</span>
</div>
<div class="grid grid-cols-3 gap-2">
<!-- Segment: Full -->
<label class="segment-button cursor-pointer">
<input class="sr-only" name="lunch_selection" type="radio">
<div class="border border-gray-200 rounded-xl p-2 text-center transition-colors">
<div class="font-semibold text-sm mb-0.5">Full</div>
<div class="text-xs text-gray-500">₹80</div>
</div>
</label>
<!-- Segment: Half (Selected) -->
<label class="segment-button cursor-pointer">
<input checked="" class="sr-only" name="lunch_selection" type="radio">
<div class="border border-gray-200 rounded-xl p-2 text-center transition-colors">
<div class="font-semibold text-sm mb-0.5">Half</div>
<div class="text-xs text-gray-500">₹50</div>
</div>
</label>
<!-- Segment: Skip -->
<label class="segment-button cursor-pointer">
<input class="sr-only" name="lunch_selection" type="radio">
<div class="border border-gray-200 rounded-xl p-2 text-center transition-colors">
<div class="font-semibold text-sm mb-0.5">Skip</div>
<div class="text-xs text-gray-500">₹0</div>
</div>
</label>
</div>
</article>
<!-- Dinner Card -->
<article class="glass-card rounded-2xl p-4">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center space-x-2 text-indigo-500">
<i class="fa-regular fa-moon text-lg"></i>
<h3 class="font-semibold text-gray-900">Dinner</h3>
</div>
<span class="text-sm font-medium text-indigo-600">₹50</span>
</div>
<div class="grid grid-cols-3 gap-2">
<!-- Segment: Full -->
<label class="segment-button cursor-pointer">
<input class="sr-only" name="dinner_selection" type="radio">
<div class="border border-gray-200 rounded-xl p-2 text-center transition-colors">
<div class="font-semibold text-sm mb-0.5">Full</div>
<div class="text-xs text-gray-500">₹80</div>
</div>
</label>
<!-- Segment: Half (Selected) -->
<label class="segment-button cursor-pointer">
<input checked="" class="sr-only" name="dinner_selection" type="radio">
<div class="border border-gray-200 rounded-xl p-2 text-center transition-colors">
<div class="font-semibold text-sm mb-0.5">Half</div>
<div class="text-xs text-gray-500">₹50</div>
</div>
</label>
<!-- Segment: Skip -->
<label class="segment-button cursor-pointer">
<input class="sr-only" name="dinner_selection" type="radio">
<div class="border border-gray-200 rounded-xl p-2 text-center transition-colors">
<div class="font-semibold text-sm mb-0.5">Skip</div>
<div class="text-xs text-gray-500">₹0</div>
</div>
</label>
</div>
</article>
</section>
<!-- END: Meal Selections -->
<!-- BEGIN: Daily Total Summary -->
<section class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex items-center justify-between" data-purpose="daily-summary">
<div>
<p class="text-xs text-gray-500 mb-1">Today's Total</p>
<p class="text-2xl font-bold text-gray-900">₹100</p>
</div>
<div class="bg-green-50 text-green-700 px-3 py-1.5 rounded-full text-xs font-medium flex items-center border border-green-100">
<i class="fa-solid fa-check-circle mr-1.5"></i> Saved
      </div>
</section>
<!-- END: Daily Total Summary -->
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Bottom Navigation -->
<nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center z-20 pb-safe">
<a class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition-colors" href="#">
<i class="fa-solid fa-house mb-1 text-lg"></i>
<span class="text-[10px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center text-[#5e5ce6] transition-colors" href="#">
<i class="fa-solid fa-utensils mb-1 text-lg"></i>
<span class="text-[10px] font-medium">Tiffin</span>
</a>
<a class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition-colors" href="#">
<i class="fa-solid fa-wallet mb-1 text-lg"></i>
<span class="text-[10px] font-medium">Expenses</span>
</a>
<a class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition-colors" href="#">
<i class="fa-solid fa-gear mb-1 text-lg"></i>
<span class="text-[10px] font-medium">Settings</span>
</a>
</nav>
<!-- END: Bottom Navigation -->


</body></html>
