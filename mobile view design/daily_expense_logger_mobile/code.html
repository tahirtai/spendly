<!-- BEGIN: Interactive Scripts -->
<script data-purpose="bottom-sheet-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const fabBtn = document.getElementById('fabBtn');
      const closeBtn = document.getElementById('closeSheetBtn');
      const overlay = document.getElementById('modalOverlay');
      const bottomSheet = document.getElementById('bottomSheet');

      function openSheet() {
        overlay.classList.add('open');
        bottomSheet.classList.add('open');
        document.body.style.overflow = 'hidden'; // Prevent background scrolling
      }

      function closeSheet() {
        overlay.classList.remove('open');
        bottomSheet.classList.remove('open');
        document.body.style.overflow = '';
      }

      fabBtn.addEventListener('click', openSheet);
      closeBtn.addEventListener('click', closeSheet);
      overlay.addEventListener('click', closeSheet);

      // Simple drag to close implementation
      let startY = 0;
      let currentY = 0;
      const sheetHandle = document.getElementById('sheetHandle');

      sheetHandle.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        bottomSheet.style.transition = 'none';
      }, {passive: true});

      sheetHandle.addEventListener('touchmove', (e) => {
        currentY = e.touches[0].clientY;
        const diff = currentY - startY;
        if (diff > 0) { // Only allow dragging down
          bottomSheet.style.transform = `translateY(${diff}px)`;
        }
      }, {passive: true});

      sheetHandle.addEventListener('touchend', (e) => {
        bottomSheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        const diff = currentY - startY;
        if (diff > 100) {
          closeSheet();
          // Reset transform after animation
          setTimeout(() => { bottomSheet.style.transform = ''; }, 300);
        } else {
          bottomSheet.style.transform = 'translateY(0)';
        }
      });
    });
  </script>
<!-- END: Interactive Scripts -->
