<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spendly Platform - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-styles">
    body {
      background-color: #f4f7fe;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: Mobile Login Container -->
<main class="w-full max-w-md mx-auto relative z-10">
<!-- Top Decorative Shape (Optional, for visual interest similar to original design's background) -->
<div class="absolute top-[-50px] left-[-30px] w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-30 z-0 hidden"></div>
<div class="absolute bottom-[-50px] right-[-30px] w-40 h-40 bg-indigo-500 rounded-full mix-blend-multiply filter blur-xl opacity-30 z-0 hidden"></div>
<!-- Main Card -->
<div class="glass-effect rounded-3xl shadow-xl overflow-hidden border border-white/50 relative z-10">
<!-- Brand & Info Section (Top on mobile) -->
<section class="bg-gradient-to-br from-indigo-900 to-blue-800 text-white p-8 pb-10 rounded-b-[2rem]">
<!-- Logo/Icon -->
<div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center border border-white/20 mb-6">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<h1 class="text-display-lg font-display-lg mb-3">Spendly Platform</h1>
<p class="text-indigo-100/80 text-sm leading-relaxed mb-6">
          Smart hostel &amp; PG expense splitting, automated tiffin management, and transparent monthly ledger for roommates.
        </p>
<!-- Features list (simplified for mobile) -->
<ul class="space-y-3">
<li class="flex items-center text-sm text-indigo-100/90">
<svg class="w-5 h-5 mr-3 text-green-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
            Role-based access &amp; instant audit log
          </li>
<li class="flex items-center text-sm text-indigo-100/90">
<svg class="w-5 h-5 mr-3 text-indigo-300" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
            Automated settlement calculations
          </li>
</ul>
</section>
<!-- Form Section -->
<section class="p-6 pt-8 bg-white/80">
<!-- Toggle Tabs -->
<div class="flex p-1 bg-gray-100 rounded-xl mb-8">
<button class="flex-1 py-2.5 px-4 rounded-lg bg-white shadow-sm text-sm font-semibold text-gray-800 transition-all">
            Sign In
          </button>
<button class="flex-1 py-2.5 px-4 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">
            Create Account
          </button>
</div>
<!-- Header -->
<div class="mb-8">
<h2 class="text-headline-md font-headline-md text-gray-900 mb-2">Welcome back</h2>
<p class="text-sm text-gray-500">Enter your credentials to access your hostel dashboard</p>
</div>
<!-- Form -->
<form action="#" class="space-y-5" id="login-form" method="POST">
<!-- Email Input -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1.5" for="email">Email Address</label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<input class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 sm:text-sm border-gray-200 rounded-xl py-3.5 bg-gray-50 transition-colors" id="email" name="email" placeholder="talha1356@gmail.com" type="email" value="talha1356@gmail.com"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-sm font-medium text-gray-700 mb-1.5" for="password">Password</label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<input class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 sm:text-sm border-gray-200 rounded-xl py-3.5 bg-gray-50 transition-colors" id="password" name="password" placeholder="••••••" type="password" value="password123"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-4 px-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-300 relative overflow-hidden" id="submit-btn" type="submit">
<span class="flex items-center transition-opacity duration-300" id="btn-text">Sign In to Spendly <svg class="ml-2 -mr-1 w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg></span>
<span class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300 pointer-events-none" id="btn-loader">
<svg class="animate-spin h-5 w-5 text-white" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path></svg>
<span class="ml-2">Logging in...</span>
</span>
<span class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300 pointer-events-none" id="btn-success">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</span>
</button>
</div>
</form>
</section>
</div>
</main>
<!-- END: Mobile Login Container -->
<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btnText = document.getElementById('btn-text');
    const btnLoader = document.getElementById('btn-loader');
    const btnSuccess = document.getElementById('btn-success');
    const btn = document.getElementById('submit-btn');
    
    // Start loading state
    btnText.classList.add('opacity-0');
    btnLoader.classList.remove('opacity-0');
    btn.classList.add('cursor-not-allowed', 'opacity-90');
    
    // Simulate API call, then show success state
    setTimeout(() => {
      btnLoader.classList.add('opacity-0');
      btnSuccess.classList.remove('opacity-0');
      btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-800');
      btn.classList.add('bg-green-500', 'hover:bg-green-600');
      
      // Reset button after success
      setTimeout(() => {
        btnSuccess.classList.add('opacity-0');
        btnText.classList.remove('opacity-0');
        btn.classList.remove('cursor-not-allowed', 'opacity-90', 'bg-green-500', 'hover:bg-green-600');
        btn.classList.add('bg-indigo-600', 'hover:bg-indigo-800');
      }, 2000);
    }, 2000);
  });
</script>
</body></html>
