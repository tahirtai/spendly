<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Spendly Platform - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-utilities">
    .glass-effect {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-slate-50 antialiased text-slate-800 min-h-screen flex items-center justify-center p-4" style="font-family: Manrope, sans-serif;">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden glass-effect flex flex-col relative pb-8">
<!-- BEGIN: BrandingHeader -->
<header class="bg-gradient-to-br from-indigo-800 to-blue-700 p-8 text-white text-center rounded-t-3xl relative overflow-hidden">
<!-- Background overlay effect -->
<div class="absolute inset-0 bg-black/10 z-0"></div>
<div class="relative z-10 flex flex-col items-center">
<!-- Logo Icon -->
<div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mb-4 border border-white/20">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight mb-2">Spendly Platform</h1>
<p class="text-sm text-indigo-100 font-medium">Smart expense splitting for roommates</p>
</div>
</header>
<!-- END: BrandingHeader -->
<!-- BEGIN: FormSection -->
<section class="px-6 py-8">
<!-- Tab Switcher -->
<div class="bg-slate-100 p-1 rounded-xl flex mb-8">
<a class="flex-1 text-center py-2 text-sm font-medium text-slate-500 rounded-lg hover:text-slate-700 transition-colors" href="#">Sign In</a>
<a class="flex-1 text-center py-2 text-sm font-semibold bg-white text-slate-900 rounded-lg shadow-sm" href="#">Create Account</a>
</div>
<div class="mb-6">
<h2 class="text-xl font-bold text-slate-900">Create Student Account</h2>
<p class="text-sm text-slate-500 mt-1">Join your hostel group easily.</p>
</div>
<form action="#" class="space-y-5" method="POST">
<!-- Full Name Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="pl-10 block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-3 transition-colors" id="fullName" name="fullName" placeholder="Student Name" required="" type="text">
</div>
</div>
<!-- Email Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="pl-10 block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-3 transition-colors" id="email" name="email" placeholder="talha1356@gmail.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="pl-10 block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-3 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Phone Number Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="pl-10 block w-full rounded-xl border-slate-200 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-3 transition-colors" id="phone" name="phone" placeholder="+91 98765 43210" required="" type="tel">
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-primary-container hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" type="submit">
            Create Account
            <svg class="ml-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</form>
</section>
<!-- END: FormSection -->
</main>
<!-- END: MainContainer -->


</body></html>
