<!DOCTYPE html>

<body class="h-full bg-background flex text-on-surface antialiased overflow-hidden">
<!-- Split Screen Container -->
<div class="flex min-h-screen w-full">
<!-- Left Side: Image / Atmospheric Focus -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface-container-low overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent"></div>
<div class="absolute -top-2xl -left-2xl w-96 h-96 bg-primary/10 rounded-full blur-[80px]"></div>
<div class="absolute bottom-0 right-0 w-full h-1/2 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
<div class="relative z-10 w-full h-full flex flex-col justify-between p-2xl">
<!-- Brand Anchor -->
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary font-headline-md text-headline-md">S</div>
<span class="font-headline-md text-headline-md font-bold tracking-tight text-primary">Spendly</span>
</div>
<!-- Atmospheric Content -->
<div class="max-w-md">
<h1 class="font-display-lg text-display-lg text-on-surface mb-lg">Precision finance, effortless scale.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join Spendly to manage your team's expenses with absolute clarity and control.</p>
</div>
<!-- Abstract Visual (Placeholder) -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-[120%] h-[120%] opacity-20" data-alt="An abstract, high-end 3D rendering of interconnected glass spheres and soft, glowing light lines representing financial data flow. The scene is bright, minimalist, and atmospheric, utilizing a high-key light mode aesthetic with subtle indigo and soft teal refractions. The composition is dynamic yet clean, perfectly suited for a premium SaaS 2026 startup vibe." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBbynGV4LV-CuxKlhXtfOnPE8ZkeWevsZcsiBbentWgbbkVzXicXA7AqV1fThSMyK1TJUBD0aOmiozvFEmPzYKJY9RV6UNLp-cL69vrV48ZE02RP3VEFoVI9E3ONMverlOhNkRvHtLpNV4PGE8hknz-dL0a5iL43R6wpIkZluFqd0lxUO5XPhjLa6zpsCBboVddJBTGjdcMu-LIqHezpswR_tyfLKLMUdrx_ff5VlZVaR6wZwWPY2Xr')"></div>
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="flex w-full lg:w-1/2 items-center justify-center p-md sm:p-xl bg-background">
<div class="w-full max-w-[440px]">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="lg:hidden flex items-center gap-sm mb-xl justify-center">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary font-headline-md text-headline-md">S</div>
<span class="font-headline-md text-headline-md font-bold tracking-tight text-primary">Spendly</span>
</div>
<!-- Form Header -->
<div class="mb-xl text-center lg:text-left">
<h2 class="font-headline-lg text-headline-lg mb-sm">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to get started with Spendly.</p>
</div>
<!-- Glassmorphic Form Container -->
<div class="bg-white/65 backdrop-blur-[30px] border border-white/40 shadow-[0_10px_40px_rgba(0,0,0,0.03)] rounded-xl p-lg">
<form class="space-y-md">
<!-- Full Name -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full bg-black/5 border-none rounded-lg font-body-md text-body-md text-on-surface px-md py-[10px] focus:ring-1 focus:ring-primary focus:shadow-[0_0_0_4px_rgba(70,72,212,0.1)] transition-all" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="email">Work Email</label>
<input class="w-full bg-black/5 border-none rounded-lg font-body-md text-body-md text-on-surface px-md py-[10px] focus:ring-1 focus:ring-primary focus:shadow-[0_0_0_4px_rgba(70,72,212,0.1)] transition-all" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<input class="w-full bg-black/5 border-none rounded-lg font-body-md text-body-md text-on-surface px-md py-[10px] pr-10 focus:ring-1 focus:ring-primary focus:shadow-[0_0_0_4px_rgba(70,72,212,0.1)] transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-md text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[16px]">visibility</span>
</button>
</div>
</div>
<!-- Workspace ID (Optional) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="workspaceId">Workspace ID <span class="font-normal opacity-70">(Optional)</span></label>
<input class="w-full bg-black/5 border-none rounded-lg font-body-md text-body-md text-on-surface px-md py-[10px] focus:ring-1 focus:ring-primary focus:shadow-[0_0_0_4px_rgba(70,72,212,0.1)] transition-all" id="workspaceId" name="workspaceId" placeholder="team-slug" type="text"/>
</div>
<!-- Terms -->
<div class="flex items-start gap-sm pt-sm">
<div class="flex h-5 items-center">
<input class="h-4 w-4 rounded border-outline-variant bg-black/5 text-primary focus:ring-primary focus:ring-offset-background" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="text-sm leading-5">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                                    I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                                </label>
</div>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full flex justify-center py-[10px] px-md border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                                Create Account
                            </button>
</div>
</form>
</div>
<!-- Footer Link -->
<p class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Log in</a>
</p>
</div>
</div>
</div>
</body></html>
