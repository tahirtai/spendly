<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "primary-fixed-dim": "#c0c1ff",

                        "error": "#ba1a1a",

                        "inverse-surface": "#213145",
                        "surface-container": "#e5eeff",
                        "on-primary-container": "#fffbff",
                        "secondary-fixed-dim": "#4edea3",
                        "tertiary": "#994100",
                        "surface-container-lowest": "#ffffff",

                    "fontFamily": {

                        "display-lg": ["Geist"],

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: #ffffff;
            border-color: #4648d4;
            box-shadow: 0 0 0 4px rgba(70, 72, 212, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center font-sans antialiased text-on-surface">
<main class="w-full h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Panel: Form -->
<section class="w-full md:w-1/2 h-full flex flex-col items-center justify-center p-md md:p-xl lg:p-2xl bg-surface relative z-10">
<div class="w-full max-w-md flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col gap-sm text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Spendly</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome back. Please enter your details.</p>
</div>
<!-- Form Card -->
<div class="glass-card rounded-xl p-lg flex flex-col gap-md">
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="glass-input rounded-lg h-12 px-md font-body-md text-body-md w-full" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<input class="glass-input rounded-lg h-12 px-md font-body-md text-body-md w-full" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-sm cursor-pointer">
<input class="rounded text-primary focus:ring-primary h-4 w-4 border-outline-variant bg-white/50" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="h-12 w-full bg-primary hover:bg-primary-container text-on-primary rounded-lg font-label-md text-label-md transition-colors mt-sm flex items-center justify-center gap-sm shadow-[0_4px_14px_rgba(70,72,212,0.39)]" type="submit">
                            Sign in
                            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-sm">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">or</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<button class="h-12 w-full bg-white hover:bg-surface-container-low border border-outline-variant/30 text-on-surface rounded-lg font-label-md text-label-md transition-colors flex items-center justify-center gap-sm">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Sign in with Google
                    </button>
</div>
<!-- Footer -->
<p class="font-body-sm text-body-sm text-center text-on-surface-variant">
                    Don't have an account? <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Request access</a>
</p>
</div>
</section>
<!-- Right Panel: Visual -->
<section class="hidden md:flex w-1/2 h-full bg-surface-container-low relative overflow-hidden items-center justify-center">
<!-- Decorative Blur Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/20 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-container/30 blur-[120px] pointer-events-none"></div>
<div class="relative w-[80%] h-[80%] max-w-2xl max-h-[800px] rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.08)]">
<img class="object-cover w-full h-full" data-alt="A highly detailed, abstract 3D geometric composition featuring soft, frosted glass spheres and pristine white cubic structures interacting with soft, high-key studio lighting. The scene embodies a 2026 premium SaaS aesthetic, emphasizing atmospheric depth, minimal refraction, and elegant shadows. The color palette consists of brilliant whites, soft grays, and very subtle hints of primary blue and secondary mint green catching the edges of the glass objects. The mood is precise, serene, and technologically advanced, perfectly suited for a high-end financial dashboard." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUlNcfKMTcVxQSsLBLnBDrFf8PbUgvAZCndth5JDRy6TbVobtom12GuuT-CjkgdlwyepfDczxI9S7Sntjo9CtoKRR4VCMYExNU8qXPWB_p3DQXorYBWZVJ6KSTEI6CDlBNJUdXdSmgZKDqoXv1NG06tRrK-LNhWUik-3MNQGwc0JqtBsbV_KUWKTlTood035DYIWYSbI-pJXCFU92YstxmDzcKET26e0r-7nZresgpjBLdPr5yZeld"/>
</div>
<!-- Floating Data Card (Ornamental) -->
<div class="absolute bottom-12 left-12 glass-card rounded-xl p-md flex items-center gap-md animate-pulse duration-[3000ms]">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">trending_up</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Platform Growth</p>
<p class="font-headline-md text-headline-md text-on-surface">+24.8%</p>
</div>
</div>
</section>
</main>
</body></html>
